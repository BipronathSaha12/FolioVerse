services:
  - type: web
    name: folioverse-api
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn folioverse_api.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
