name: Security Vulnerability & Dependency Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly security scan on Mondays at 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    name: Backend Dependency & Config Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit -r backend/requirements.txt

      - name: Run pip-audit (Known CVE Vulnerability Check)
        run: |
          pip-audit -r backend/requirements.txt

      - name: Run Bandit (Python Static Application Security Testing)
        run: |
          bandit -r backend/ -x backend/venv/,backend/staticfiles/ -ll

      - name: Validate Django Production Security Configuration
        env:
          SECRET_KEY: 'ci-temporary-production-test-key-must-not-be-used-in-live'
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1,api.folioverse.com'
          DATABASE_URL: 'sqlite:///test_security_audit.sqlite3'
        run: |
          cd backend
          python manage.py check --deploy --fail-level WARNING

  frontend-security:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit (Frontend Supply Chain Audit)
        run: |
          cd frontend
          npm audit --audit-level=high
